plugins {
    id 'java'
}

version = '1.0.0'
group = 'net.timahivisuals'

repositories {
    mavenCentral()
    maven { url = "https://minecraft.net" }
    maven { url = "https://fabricmc.net" }
}

dependencies {
    // Этот блок заставит сервер GitHub автоматически подтянуть все нужные библиотеки Fabric и Minecraft из интернета
    compileOnly "net.fabricmc:fabric-loader:0.16.9"
    compileOnly "net.fabricmc.fabric-api:fabric-api:0.113.0+1.21.4"
    compileOnly "com.mojang:minecraft:1.21.4"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:none'
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    from(sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        include 'pulsevisuals.mixins.json'
    }
}

jar {
    archiveFileName = 'timahivisuals-1.0.0.jar'
    from sourceSets.main.output
}
