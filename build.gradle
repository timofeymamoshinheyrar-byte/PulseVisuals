plugins {
    id 'fabric-loom' version '1.8.11'
    id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archives_base_name = 'timahivisuals'
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = "https://fabricmc.net" }
    maven { url = "https://minecraft.net" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings() // Обход блокировки маппингов
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename it, "LICENSE_${archives_base_name}"
    }
}

publishingConvention {
    registerPublication {
        it.artifactId = archives_base_name
    }
}
